name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sidebar-sections:
    name: dsh-sidebar-sections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify plugin
        run: node scripts/check.mjs
